<text x="92" y="372" fill="#e6edf3"><tspan fill="#ff7b72">const</tspan> client = <tspan fill="#ff7b72">new</tspan> <tspan fill="#d2a8ff">WhatsAppClient</tspan>({ accessToken, phoneNumberId });</text>
