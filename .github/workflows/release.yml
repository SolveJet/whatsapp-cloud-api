# Release workflow — publishes the package to npm via OIDC Trusted Publishing.
#
# No NPM_TOKEN is required. Authentication uses GitHub Actions' OIDC identity,
# which the npm CLI (>= 11.5.1, bundled with Node 24) exchanges for a
# short-lived publish token at publish time.
#
# Trusted publisher setup on npmjs.com (Package -> Settings -> Trusted Publisher
# -> GitHub Actions). ALL fields are CASE-SENSITIVE and must match the GitHub
# OIDC token claims exactly:
#   Organization or user: SolveJet         (canonical GitHub org casing)
#   Repository:           whatsapp-cloud-api
#   Workflow filename:    release.yml
#   Environment name:     (empty)
# A casing mismatch (e.g. "solvejet") makes npm's token exchange return 404
# "package not found", which the npm CLI then reports as a misleading ENEEDAUTH.
#
# One setup-node quirk is handled below: with `registry-url` set, setup-node
# writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc. With
# no NODE_AUTH_TOKEN that expands to empty, npm treats it as configured auth and
# skips OIDC. We strip that line (keeping the registry line) before publishing,
# and never set NODE_AUTH_TOKEN. Ref: https://github.com/npm/documentation/issues/1960
#
# Triggers:
#   - release: published  -> normal path, publishes on a GitHub release.
#   - workflow_dispatch   -> manual re-run (retry a publish / validate trusted
#                            publisher) without creating a new tag/release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # Keep `registry-url` so the registry is written to .npmrc — npm needs it
      # to target the OIDC exchange. The empty `_authToken` line it also writes
      # is stripped in the publish step below.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # On a release trigger, the tag must match package.json. On a manual
      # workflow_dispatch run there is no tag ref, so this check is skipped.
      - name: Verify package version matches release tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          echo "package.json: $PKG_VERSION | release tag: $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version ($PKG_VERSION). Bump the version and re-tag."
            exit 1
          fi

      - name: Build
        run: pnpm run build

      # Strip the empty _authToken line setup-node wrote (keeping the registry
      # line), confirm the OIDC request env is present, then publish. Do NOT set
      # NODE_AUTH_TOKEN — an empty value defeats OIDC. Uses Node 24's bundled npm.
      - name: Publish (OIDC trusted publishing)
        run: |
          echo "npm version: $(npm --version)"
          for f in "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" "$HOME/.npmrc" "$PWD/.npmrc"; do
            if [ -f "$f" ]; then
              sed -i '/_authToken/d;/always-auth/d' "$f"
            fi
          done
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is not set — OIDC cannot run. Check 'id-token: write' permission."
            exit 1
          fi
          npm publish --access public
