# Release workflow — publishes the package to npm via OIDC Trusted Publishing.
#
# No NPM_TOKEN is required. Authentication uses GitHub Actions' OIDC identity,
# which the npm CLI (>= 11.5.1) exchanges for a short-lived publish token at
# publish time.
#
# IMPORTANT: we deliberately do NOT set `registry-url` on actions/setup-node.
# When `registry-url` is set, setup-node writes
# `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into the runner .npmrc.
# With no NODE_AUTH_TOKEN (the intended state for trusted publishing), that
# placeholder expands to empty, npm treats it as "auth already configured",
# skips the OIDC exchange, and the anonymous publish fails with ENEEDAUTH/E404.
# By omitting `registry-url` no auth line is written, so npm detects the OIDC
# env (ACTIONS_ID_TOKEN_REQUEST_*) and runs the token exchange. The registry is
# passed explicitly on the publish command. Ref:
# https://github.com/npm/documentation/issues/1960
#
# One-time setup on npmjs.com (Package -> Settings -> Trusted Publisher ->
# GitHub Actions): Organization/user "solvejet", Repository
# "whatsapp-cloud-api", Workflow filename "release.yml", Environment name EMPTY.
#
# Triggers:
#   - release: published  -> normal path, publishes on a GitHub release.
#   - workflow_dispatch    -> manual re-run (e.g. to validate the trusted
#                             publisher or retry a failed publish) without
#                             creating a new tag/release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # No `registry-url` here — see the header comment. Setting it writes an
      # empty _authToken line that short-circuits the OIDC exchange.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # On a release trigger, the tag must match package.json. On a manual
      # workflow_dispatch run there is no tag ref, so this check is skipped.
      - name: Verify package version matches release tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          echo "package.json: $PKG_VERSION | release tag: $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version ($PKG_VERSION). Bump the version and re-tag."
            exit 1
          fi

      - name: Build
        run: pnpm run build

      # Trusted publishing needs an OIDC-capable npm CLI (>= 11.5.1). Node 24
      # ships a recent npm, but pin to latest to be safe.
      - name: Update npm
        run: npm install -g npm@latest

      # Guard: fail loudly if setup-node (or anything else) left an _authToken
      # line in any .npmrc, since that silently disables OIDC. Then publish,
      # pointing npm at the public registry explicitly (no registry-url).
      - name: Publish (OIDC trusted publishing)
        run: |
          echo "npm version: $(npm --version)"
          for f in "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" "$HOME/.npmrc" "$PWD/.npmrc"; do
            if [ -f "$f" ] && grep -q '_authToken' "$f"; then
              echo "Removing _authToken line from $f (would disable OIDC)"
              sed -i '/_authToken/d;/always-auth/d' "$f"
            fi
          done
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is not set — OIDC cannot run. Check 'id-token: write' permission."
            exit 1
          fi
          npm publish --access public --registry=https://registry.npmjs.org/
