# Release workflow — publishes the package to npm via OIDC Trusted Publishing.
#
# No NPM_TOKEN is required. Authentication uses GitHub Actions' OIDC identity,
# which the npm CLI exchanges for a short-lived publish token at publish time.
# One-time setup on npmjs.com (Package → Settings → Trusted Publisher →
# GitHub Actions): Organization/user "SolveJet", Repository
# "whatsapp-cloud-api", Workflow filename "release.yml", Allowed action
# "npm publish".
#
# OIDC publishing needs: `id-token: write` (below), npm >= 11.5.1 (we install
# npm@latest), and a registry configured for the scope so npm knows where to
# run the token exchange. `registry-url` on setup-node provides that mapping,
# but it also writes an `.npmrc` line `_authToken=${NODE_AUTH_TOKEN}`; with no
# token that line makes npm attempt (failing) token auth, so we strip it before
# publishing. npm then falls through to the OIDC exchange.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package version matches release tag
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          echo "package.json: $PKG_VERSION | release tag: $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version ($PKG_VERSION). Bump the version and re-tag."
            exit 1
          fi

      - name: Build
        run: pnpm run build

      # Ensure an OIDC-capable npm CLI (trusted publishing needs >= 11.5.1).
      - name: Update npm
        run: npm install -g npm@latest

      # setup-node writes an .npmrc with `_authToken=${NODE_AUTH_TOKEN}`. With no
      # token set, that line makes npm try (and fail) token auth instead of OIDC.
      # Remove any auth-token line so npm uses the OIDC id-token exchange.
      - name: Remove token placeholder from .npmrc
        run: |
          for f in "$NPM_CONFIG_USERCONFIG" "$HOME/.npmrc"; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              echo "Scrubbing _authToken from $f"
              sed -i '/_authToken/d' "$f" || true
            fi
          done

      # Publish with the OIDC-capable npm. --access public for the scoped
      # package; --provenance records a build attestation.
      - name: Publish
        run: |
          echo "npm version: $(npm --version)"
          npm publish --provenance --access public
