# Release workflow — publishes the package to npm via OIDC Trusted Publishing.
#
# No NPM_TOKEN is required. Authentication uses GitHub Actions' OIDC identity,
# which npm exchanges for a short-lived publish token at publish time. This
# requires a one-time setup on npmjs.com:
#   Package → Settings → Trusted Publisher → GitHub Actions, with
#     Organization/user: solvejet
#     Repository:        whatsapp-cloud-api
#     Workflow filename: release.yml
# Trusted publishing also requires the package to already exist on npm (publish
# the first version manually once), npm CLI >= 11.5.1, and Node >= 22.14.0.
# Provenance attestations are generated automatically for public repos — no
# --provenance flag needed.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package version matches release tag
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          echo "package.json: $PKG_VERSION | release tag: $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version ($PKG_VERSION). Bump the version and re-tag."
            exit 1
          fi

      - name: Build
        run: pnpm run build

      # Ensure an OIDC-capable npm CLI (trusted publishing needs >= 11.5.1).
      - name: Update npm
        run: npm install -g npm@latest

      # Publish with the npm CLI so it performs the OIDC token exchange.
      # access/provenance come from package.json publishConfig.
      - name: Publish
        run: npm publish --no-git-checks
