# Release workflow — publishes the package to npm via OIDC Trusted Publishing.
#
# No NPM_TOKEN is required. Authentication uses GitHub Actions' OIDC identity,
# which the npm CLI exchanges for a short-lived publish token at publish time.
# One-time setup on npmjs.com (Package → Settings → Trusted Publisher →
# GitHub Actions): Organization/user "SolveJet", Repository
# "whatsapp-cloud-api", Workflow filename "release.yml", Allowed action
# "npm publish".
#
# IMPORTANT: do NOT set `registry-url` on actions/setup-node here. That makes
# setup-node write an .npmrc containing `_authToken=${NODE_AUTH_TOKEN}`; with no
# token present npm attempts (failing) token auth instead of OIDC and the
# publish fails with a misleading 404. Leaving it unset lets the OIDC-capable
# npm CLI authenticate via the id-token. OIDC needs npm >= 11.5.1 (Node 24
# ships a compatible npm; we also upgrade npm to be safe).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package version matches release tag
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          echo "package.json: $PKG_VERSION | release tag: $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version ($PKG_VERSION). Bump the version and re-tag."
            exit 1
          fi

      - name: Build
        run: pnpm run build

      # Ensure an OIDC-capable npm CLI (trusted publishing needs >= 11.5.1).
      - name: Update npm
        run: npm install -g npm@latest

      # Publish with the npm CLI so it performs the OIDC token exchange.
      # --access public for the scoped package; --provenance records a build
      # attestation (auto-enabled under OIDC for public repos, set explicitly
      # here for clarity).
      - name: Publish
        run: npm publish --provenance --access public
