name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # Dev-tooling checks. The toolchain (vitest 5) requires Node >= 22.12, so
  # lint/typecheck/test/build run on Node 22 and 24. The published package still
  # supports Node 20 — that is verified separately by the `node20-smoke` job,
  # which exercises the built artifact with zero dev dependencies installed.
  build:
    name: Lint, typecheck, test, build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

  # Verifies the published artifact loads and works on Node 20 (engines.node is
  # ">=20"). It builds on Node 22, then imports the ESM and CJS entry points on
  # Node 20 WITHOUT installing dev dependencies (vitest 5 requires Node >= 22,
  # so a full install would fail on Node 20 — but the shipped package has zero
  # runtime deps, so the built dist/ loads cleanly).
  node20-smoke:
    name: Node 20 artifact smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js 22 (for building)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Set up Node.js 20 (for the smoke test)
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Smoke-test the built package on Node 20
        run: |
          node --version
          # CJS: require every entry point and assert its public API.
          node -e "
          const assert = require('node:assert');
          const index = require('./dist/index.cjs');
          const web = require('./dist/web.cjs');
          const testing = require('./dist/testing.cjs');
          assert.strictEqual(typeof index.WhatsAppClient, 'function');
          assert.strictEqual(typeof index.createWebhookHandler, 'function');
          new index.WhatsAppClient({ accessToken: 't', phoneNumberId: 'p' });
          assert.strictEqual(typeof web.createWebhookHandler, 'function');
          assert.strictEqual(typeof web.verifySignatureAsync, 'function');
          assert.strictEqual(typeof testing.signWebhookBody, 'function');
          assert.strictEqual(typeof testing.buildWebhookPayload, 'function');
          assert.strictEqual(typeof testing.createTestRequest, 'function');
          console.log('CJS load OK on Node', process.version);
          "
          # ESM: dynamic import of every entry point, same assertions.
          node --input-type=module -e "
          import assert from 'node:assert';
          const index = await import('./dist/index.js');
          const web = await import('./dist/web.js');
          const testing = await import('./dist/testing.js');
          assert.strictEqual(typeof index.WhatsAppClient, 'function');
          assert.strictEqual(typeof index.createWebhookHandler, 'function');
          new index.WhatsAppClient({ accessToken: 't', phoneNumberId: 'p' });
          assert.strictEqual(typeof web.createWebhookHandler, 'function');
          assert.strictEqual(typeof web.verifySignatureAsync, 'function');
          assert.strictEqual(typeof testing.signWebhookBody, 'function');
          assert.strictEqual(typeof testing.buildWebhookPayload, 'function');
          assert.strictEqual(typeof testing.createTestRequest, 'function');
          console.log('ESM load OK on Node', process.version);
          "
          # Signed round trip through the built files (CJS and ESM builds).
          node -e "
          const assert = require('node:assert');
          const { createWebhookHandler } = require('./dist/web.cjs');
          const { buildWebhookPayload, createTestRequest } = require('./dist/testing.cjs');
          (async () => {
            const seen = [];
            const handler = createWebhookHandler({ appSecrets: 's3cret' });
            handler.on('message', ({ message }) => { seen.push(message.id); });
            const ok = await handler.handleRequest(await createTestRequest({ payload: buildWebhookPayload('text'), secret: 's3cret' }));
            const bad = await handler.handleRequest(await createTestRequest({ payload: buildWebhookPayload('text'), secret: 'wrong' }));
            assert.strictEqual(ok.status, 200);
            assert.strictEqual(bad.status, 401);
            assert.strictEqual(seen.length, 1);
            console.log('CJS signed round trip OK on Node', process.version);
          })();
          "
          node --input-type=module -e "
          import assert from 'node:assert';
          import { createWebhookHandler } from './dist/web.js';
          import { buildWebhookPayload, createTestRequest } from './dist/testing.js';
          const seen = [];
          const handler = createWebhookHandler({ appSecrets: 's3cret' });
          handler.on('message', ({ message }) => { seen.push(message.id); });
          const ok = await handler.handleRequest(await createTestRequest({ payload: buildWebhookPayload('text'), secret: 's3cret' }));
          const bad = await handler.handleRequest(await createTestRequest({ payload: buildWebhookPayload('text'), secret: 'wrong' }));
          assert.strictEqual(ok.status, 200);
          assert.strictEqual(bad.status, 401);
          assert.strictEqual(seen.length, 1);
          console.log('ESM signed round trip OK on Node', process.version);
          "
  edge-deno:
    name: 'Edge runtime: Deno'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Set up Deno
        uses: denoland/setup-deno@v2
      - name: Run edge check on Deno
        run: deno run --allow-read scripts/edge-check.mjs
  edge-bun:
    name: 'Edge runtime: Bun'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Run edge check on Bun
        run: bun scripts/edge-check.mjs
  edge-workerd:
    name: 'Edge runtime: Cloudflare workerd'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/cloudflare-workers/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Install worker example dependencies
        run: pnpm --dir examples/cloudflare-workers install --frozen-lockfile
      - name: Test in workerd
        run: pnpm --dir examples/cloudflare-workers test
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail only on high/critical advisories. The package ships zero runtime
      # deps, so low/moderate dev-tooling noise should not break CI.
      - name: Audit dependencies
        run: pnpm audit --audit-level high
  examples:
    name: Typecheck examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install example dependencies
        run: pnpm --dir examples install --frozen-lockfile
      - name: Typecheck examples
        run: pnpm exec tsc -p examples/tsconfig.json
  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install site dependencies
        run: pnpm --dir website install --frozen-lockfile
      - name: Audit site dependencies
        run: pnpm --dir website audit --audit-level high
      - name: Typecheck site snippets
        run: pnpm exec tsc -p website/tsconfig.snippets.json
      - name: Build site
        run: pnpm --dir website run build
