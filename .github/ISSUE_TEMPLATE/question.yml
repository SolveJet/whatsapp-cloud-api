name: Question
description: Ask a usage question about the SDK.
title: '[Question]: '
labels: ['question']
body:
  - type: markdown
    attributes:
      value: |
        Please search the [README](https://github.com/SolveJet/whatsapp-cloud-api#readme), the `examples/` directory and existing issues first.
        This is an independent SDK. Problems with the WhatsApp Business Platform itself (accounts, number verification, template approval, billing, bans) must go to Meta support.
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: Describe your goal and what you have tried. Redact access tokens, app secrets and real phone numbers.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: e.g. 1.2.1
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: e.g. Node 22, Bun 1.2, Cloudflare Workers
